<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">prisma-guard</title>
  <desc id="desc">Define Prisma data boundaries once. Reuse them across your API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101815"/>
      <stop offset="1" stop-color="#18251f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c766"/>
      <stop offset="1" stop-color="#e8a93a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#f4f1e9" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#050807" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1114" cy="74" r="210" fill="#e8b44d" opacity=".055"/>
  <circle cx="82" cy="626" r="250" fill="#e8b44d" opacity=".035"/>

  <g transform="translate(72 68)">
    <circle cx="42" cy="42" r="42" fill="#21312a" stroke="#f4f1e9" stroke-opacity=".16"/>
    <path d="M34 21h-4a6 6 0 0 0-6 6v6a7 7 0 0 1-5 7 7 7 0 0 1 5 7v6a6 6 0 0 0 6 6h4" fill="none" stroke="#f4f1e9" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <path d="M50 21h4a6 6 0 0 1 6 6v6a7 7 0 0 0 5 7 7 7 0 0 0-5 7v6a6 6 0 0 1-6 6h-4" fill="none" stroke="#f4f1e9" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <path d="m31 42 7 7 15-17" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
  </g>

  <text x="72" y="205" fill="#f4f1e9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="750" letter-spacing="-2">prisma-guard</text>
  <text x="72" y="272" fill="#d3d9d4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="500">Define Prisma data boundaries once.</text>
  <text x="72" y="314" fill="#d3d9d4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="500">Reuse them across your API.</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650">
    <g transform="translate(72 496)">
      <rect width="204" height="50" rx="25" fill="#21312a" stroke="#f4f1e9" stroke-opacity=".14"/>
      <circle cx="26" cy="25" r="5" fill="#e8b44d"/>
      <text x="43" y="32" fill="#f4f1e9">Generated validation</text>
    </g>
    <g transform="translate(290 496)">
      <rect width="218" height="50" rx="25" fill="#21312a" stroke="#f4f1e9" stroke-opacity=".14"/>
      <circle cx="26" cy="25" r="5" fill="#e8b44d"/>
      <text x="43" y="32" fill="#f4f1e9">Query + write shapes</text>
    </g>
    <g transform="translate(522 496)">
      <rect width="150" height="50" rx="25" fill="#21312a" stroke="#f4f1e9" stroke-opacity=".14"/>
      <circle cx="26" cy="25" r="5" fill="#e8b44d"/>
      <text x="43" y="32" fill="#f4f1e9">Tenant scope</text>
    </g>
  </g>

  <g transform="translate(735 116)" filter="url(#shadow)">
    <rect width="473" height="390" rx="24" fill="#0c1210" stroke="#f4f1e9" stroke-opacity=".13"/>
    <rect width="473" height="54" rx="24" fill="#18251f"/>
    <path d="M0 54h473" stroke="#f4f1e9" stroke-opacity=".1"/>
    <circle cx="28" cy="27" r="5" fill="#e8b44d"/>
    <circle cx="47" cy="27" r="5" fill="#f4f1e9" opacity=".35"/>
    <circle cx="66" cy="27" r="5" fill="#f4f1e9" opacity=".18"/>
    <text x="92" y="34" fill="#9eaaa3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">project.route.ts</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">
      <text x="32" y="106" fill="#79c7a3">await</text>
      <text x="104" y="106" fill="#f4f1e9">prisma.project</text>
      <text x="58" y="148" fill="#f4f1e9">.guard({</text>
      <text x="58" y="190" fill="#9ec7e8">where:</text>
      <text x="132" y="190" fill="#f4f1e9"> {</text>
      <text x="82" y="226" fill="#f4f1e9">title: { contains: </text>
      <text x="301" y="226" fill="#e8b44d">true</text>
      <text x="347" y="226" fill="#f4f1e9"> },</text>
      <text x="58" y="262" fill="#f4f1e9">},</text>
      <text x="58" y="298" fill="#9ec7e8">take:</text>
      <text x="121" y="298" fill="#f4f1e9"> { max: </text>
      <text x="215" y="298" fill="#d7a7ee">50</text>
      <text x="239" y="298" fill="#f4f1e9">, default: </text>
      <text x="365" y="298" fill="#d7a7ee">20</text>
      <text x="389" y="298" fill="#f4f1e9"> },</text>
      <text x="58" y="334" fill="#f4f1e9">})</text>
      <text x="58" y="372" fill="#f4f1e9">.findMany(req.body)</text>
    </g>
  </g>

  <rect x="72" y="590" width="1136" height="2" fill="url(#accent)" opacity=".7"/>
</svg>
